name: watchlist
description: "Save movies and TV series to a local watchlist."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  fpdart: ^1.2.0
  get_it: ^9.3.0
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  google_fonts: ^8.2.1
  sqflite_common_ffi: ^2.4.0+3
  test_support:
    path: ../test_support

flutter:

hooks:
  user_defines:
    sqlite3:
      source: system
